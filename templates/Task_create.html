<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-mserif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1f2937;
            padding: 30px;
        }

        h1 {
            color: #4338ca;
            margin-bottom: 20px;
        }

        form {
            max-width: 500px;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        p {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body>
    <h1>Create New Task</h1>
    <form method="post" action="/create_view/">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">Create Task</button>
    </form>
</body>
</html>
