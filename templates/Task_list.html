<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list view</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1f2937;
            padding: 30px;
        }

        h1 {
            color: #4338ca;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
        }

        .all_button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f5f7ff;
            color: #4f46e5;
        }

        tr:nth-child(even) {
            background: #fafbff;
        }

        td button {
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        .container-button{
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .container_btn_in form {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .container_btn_in input {
            flex: 1;
            border: 1px solid #c7d2fe;
            border-radius: 999px;
            padding: 10px 14px;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06);
        }

        .container_btn_in input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .container_btn_in button {
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        .container_btn_in button:hover,
        .all_button:hover,
        .logout-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.25);
        }

        .logout-btn {
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>

<body>
    <h1>Todo List</h1>
    <div class="container-button">
        <a href="/create_view/"><button class="all_button">Create Task</button></a>
        <form method="post" action="/logout/">
            {% csrf_token %}
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
    <div class="container_btn_in">
        <form method="get">
            <input type="text" name='search-param'>
            <button>Search</button>
        </form>
    </div>
    <table>
        <tr>
            <th>Task id</th>
            <th>Task summary</th>
            <th>Task detail</th>
            <th>Task deadline</th>
            <th>Task status</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>

        {% for task in all_list %}
        <tr>
            <td>{{task.id}}</td>
            <td>{{task.task_sumary}}</td>
            <td>{{task.task_deatil}}</td>
            <td>{{task.task_dadline}}</td>
            <td>{{task.task_status}}</td>
            <td><a href="/update_view/{{task.id}}/"><button class="all_button">UPDATE</button></a></td>
            <td><a href="/delete_view/{{task.id}}/"><button class="all_button">DELETE</button></a></td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
