<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list view</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1f2937;
            padding: 30px;
        }

        h1 {
            color: #4338ca;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
        }

        .all_button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
        }

        button:hover {
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f5f7ff;
            color: #4f46e5;
        }

        tr:nth-child(even) {
            background: #fafbff;
        }

        td button {
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        .container-button{
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .container_btn_in{
            justify-content: space-between;
            display: flex;
            margin-bottom: 20px;
        }

        .container_btn_in input {
            width: 100%;
            border-radius: 20px;
        }

        .container_btn_in button {
            margin-left: 30px;
        }
    </style>
</head>

<body>
    <h1>Todo List</h1>
    <div class="container-button">
        <a href="/create_view/"><button class="all_button">Create Task</button></a>
        <a href=""><button>Logout</button></a>
    </div>
    <div class="container_btn_in">
        <input type="text" name="search_param">
        <button>Search</button>
    </div>
    <table>
        <tr>
            <th>Task id</th>
            <th>Task summary</th>
            <th>Task detail</th>
            <th>Task deadline</th>
            <th>Task status</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>

        {% for task in all_list %}
        <tr>
            <td>{{task.id}}</td>
            <td>{{task.task_sumary}}</td>
            <td>{{task.task_deatil}}</td>
            <td>{{task.task_dadline}}</td>
            <td>{{task.task_status}}</td>
            <td><a href="/update_view/{{task.id}}/"><button class="all_button">UPDATE</button></a></td>
            <td><a href="/delete_view/{{task.id}}/"><button class="all_button">DELETE</button></a></td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
