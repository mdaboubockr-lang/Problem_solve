<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Task</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1f2937;
            padding: 30px;
        }

        h1 {
            color: #4338ca;
            margin-bottom: 20px;
        }

        form {
            max-width: 480px;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        p {
            color: #4b5563;
            margin-bottom: 18px;
            font-size: 1rem;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: white;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);
        }

        a {
            display: inline-block;
            margin-left: 10px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>Delete Task</h1>
    <form method="post">
        {% csrf_token %}
        <p>Are you sure you want to delete this task?</p>
        <button type="submit">Delete</button>
        <a href="/">Cancel</a>
    </form>
</body>
</html>
